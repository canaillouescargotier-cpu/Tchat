<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Overlay Chat Twitch+YouTube</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      background: transparent; 
      overflow: hidden; 
    }
    #chat { 
      width: 420px; 
      max-height: 720px; 
      font-family: sans-serif; 
      color: #fff; 
    }
    .msg { 
      padding: 6px 8px; 
      margin: 4px; 
      border-radius: 6px; 
      background: rgba(0, 0, 0, 0.6); 
    }
    .meta { 
      font-size: 12px; 
      opacity: 0.8; 
      margin-bottom: 4px; 
    }
    .text { 
      font-size: 14px; 
      word-wrap: break-word; 
    }
  </style>
</head>
<body>
  <div id="chat"></div>

  <!-- CDN tmi.js corrigé -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tmi.js/1.8.5/tmi.min.js"></script>
  <script>
    // --- CONFIGURATION ---
    const TWITCH_CHANNEL = "kameto"; // Remplace par le nom de la chaîne (sans #)
    const YOUTUBE_API_KEY = ""; // Laisse vide si pas de clé pour le moment
    const YOUTUBE_LIVE_CHAT_ID = ""; 

    const chatEl = document.getElementById('chat');

    function addMessage(source, user, text) {
      const el = document.createElement('div');
      el.className = 'msg';
      el.innerHTML = `<div class="meta">${source} • <strong>${escapeHtml(user)}</strong></div><div class="text">${escapeHtml(text)}</div>`;
      chatEl.appendChild(el);
      
      // Limite le nombre de messages affichés à l'écran
      while (chatEl.children.length > 80) chatEl.removeChild(chatEl.firstChild);
      
      // Défilement automatique
      window.scrollTo(0, document.body.scrollHeight);
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // --- TWITCH ---
    (function initTwitch() {
      if (!TWITCH_CHANNEL || TWITCH_CHANNEL === "ton_channel_twitch") return;

      const opts = {
        options: { debug: false },
        connection: { reconnect: true, secure: true },
        channels: [TWITCH_CHANNEL]
      };

      const client = new tmi.Client(opts);
      client.connect().catch(console.error);

      client.on('message', (channel, tags, message, self) => {
        if (self) return;
        addMessage('Twitch', tags['display-name'] || tags.username, message);
      });
    })();

    // --- YOUTUBE ---
    let ytNextPageToken = null;
    async function pollYouTube() {
      if (!YOUTUBE_API_KEY || !YOUTUBE_LIVE_CHAT_ID) return;
      
      try {
        const url = new URL('https://www.googleapis.com/youtube/v3/liveChat/messages');
        url.searchParams.set('liveChatId', YOUTUBE_LIVE_CHAT_ID);
        url.searchParams.set('part', 'snippet,authorDetails');
        url.searchParams.set('key', YOUTUBE_API_KEY);
        if (ytNextPageToken) url.searchParams.set('pageToken', ytNextPageToken);

        const res = await fetch(url);
        if (!res.ok) throw new Error('YT API ' + res.status);
        const data = await res.json();
        
        if (data.items) {
          for (const item of data.items) {
            const author = item.authorDetails.displayName;
            const text = item.snippet.displayMessage;
            addMessage('YouTube', author, text);
          }
        }
        
        ytNextPageToken = data.nextPageToken || null;
        const interval = (data.pollingIntervalMillis || 5000);
        setTimeout(pollYouTube, interval);
      } catch (e) {
        console.error('Erreur YouTube:', e);
        setTimeout(pollYouTube, 10000);
      }
    }

    pollYouTube();
  </script>
</body>
</html>
