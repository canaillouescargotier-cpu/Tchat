<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Overlay Chat Twitch+YouTube</title>
  <style>
    html,body { margin:0; padding:0; background:transparent; overflow:hidden; }
    #chat { width:420px; max-height:720px; font-family: sans-serif; color:#fff; }
    .msg { padding:6px 8px; margin:4px; border-radius:6px; background:rgba(0,0,0,0.45); }
    .meta { font-size:12px; opacity:0.8; margin-bottom:4px; }
    .text { font-size:14px; word-wrap:break-word; }
    /* Pour rendre la fenêtre entièrement transparente dans OBS, laisse body background transparent */
  </style>
</head>
<body>
  <div id="chat"></div>

  <script src="https://unpkg.com/tmi.js@1.8.5/dist/tmi.min.js"></script>
  <script>
    // CONFIGURE ICI
    const TWITCH_CHANNEL = "ton_channel_twitch"; // sans #
    const TWITCH_NICK = "nom_du_bot"; // optionnel
    const TWITCH_OAUTH = "oauth:XXXXXXXX"; // optionnel (recommandé)
    const YOUTUBE_API_KEY = "TA_CLE_API_YOUTUBE";
    const YOUTUBE_LIVE_CHAT_ID = "ID_DU_CHAT_EN_DIRECT"; // récupérer via videos.list?part=liveStreamingDetails&id=VID_ID

    const chatEl = document.getElementById('chat');

    function addMessage(source, user, text) {
      const el = document.createElement('div');
      el.className = 'msg';
      el.innerHTML = `<div class="meta">${source} • <strong>${escapeHtml(user)}</strong></div><div class="text">${escapeHtml(text)}</div>`;
      chatEl.appendChild(el);
      // garde un nombre limité de messages
      while (chatEl.children.length > 80) chatEl.removeChild(chatEl.firstChild);
      // scroller vers le bas
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // --- Twitch (tmi.js) ---
    (function initTwitch() {
      const opts = {
        options: { debug: false },
        connection: { reconnect: true, secure: true },
        channels: [TWITCH_CHANNEL]
      };
      if (TWITCH_OAUTH && TWITCH_NICK) {
        opts.identity = { username: TWITCH_NICK, password: TWITCH_OAUTH };
      }
      const client = new tmi.Client(opts);
      client.connect().catch(console.error);
      client.on('message', (channel, tags, message, self) => {
        if (self) return;
        addMessage('Twitch', tags['display-name'] || tags.username, message);
      });
    })();

    // --- YouTube polling ---
    let ytNextPageToken = null;
    async function pollYouTube() {
      if (!YOUTUBE_API_KEY || !YOUTUBE_LIVE_CHAT_ID) return;
      try {
        const url = new URL('https://www.googleapis.com/youtube/v3/liveChat/messages');
        url.searchParams.set('liveChatId', YOUTUBE_LIVE_CHAT_ID);
        url.searchParams.set('part', 'snippet,authorDetails');
        url.searchParams.set('key', YOUTUBE_API_KEY);
        if (ytNextPageToken) url.searchParams.set('pageToken', ytNextPageToken);

        const res = await fetch(url);
        if (!res.ok) throw new Error('YT API ' + res.status);
        const data = await res.json();
        if (data.items) {
          for (const item of data.items) {
            const author = item.authorDetails.displayName;
            const text = item.snippet.displayMessage;
            addMessage('YouTube', author, text);
          }
        }
        // récupérer le token et l'intervalle de poll recommandé
        ytNextPageToken = data.nextPageToken || null;
        const interval = (data.pollingIntervalMillis || 5000);
        setTimeout(pollYouTube, interval);
      } catch (e) {
        console.error('YouTube fetch error', e);
        setTimeout(pollYouTube, 8000);
      }
    }
    pollYouTube();
  </script>
</body>
</html>
