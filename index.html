<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Twitch & YouTube</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e10;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    .config-box {
      background-color: #1f1f23;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
    }

    input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #3a3a3d;
      background-color: #0e0e10;
      color: #fff;
    }

    button {
      padding: 10px;
      border-radius: 5px;
      border: none;
      background-color: #9146FF;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #772ce8;
    }

    #chat-box {
      height: 450px;
      border: 1px solid #3a3a3d;
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      background-color: #18181b;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      padding: 8px;
      border-radius: 4px;
      background-color: #1f1f23;
      word-break: break-word;
    }

    .platform-twitch {
      color: #a970ff;
      font-weight: bold;
    }

    .platform-yt {
      color: #ff4e4e;
      font-weight: bold;
    }

    .system {
      color: #adadb8;
      font-style: italic;
    }
  </style>

  <!-- Charge la bibliothèque Twitch -->
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/125/tmi.min.js"></script>
</head>
<body>

  <h2>Chat Direct Multi-plateforme</h2>

  <div class="config-box">
    <h3>1. Twitch</h3>
    <input type="text" id="twitch-channel" placeholder="Nom de chaîne Twitch (ex: kameto)">
    <button onclick="connectTwitch()">Connecter Twitch</button>

    <h3>2. YouTube (Pendant un Live)</h3>
    <input type="text" id="yt-api-key" placeholder="Ta Clé API YouTube Data v3">
    <input type="text" id="yt-video-id" placeholder="ID de la vidéo en Live (ex: dQw4w9WgXcQ)">
    <button onclick="connectYouTube()">Connecter YouTube</button>
  </div>

  <div id="chat-box"></div>

  <script>
    let twitchClient = null;
    let ytInterval = null;
    let nextPageToken = '';

    // --- LOGIQUE TWITCH ---
    function connectTwitch() {
      const channel = document.getElementById('twitch-channel').value.trim().toLowerCase();
      if (!channel) return alert('Entre un nom de chaîne Twitch');

      if (twitchClient) {
        twitchClient.disconnect();
      }

      twitchClient = new tmi.Client({
        options: { debug: false },
        channels: [channel]
      });

      twitchClient.connect()
        .then(() => {
          addMessage('Système', `Connecté au chat Twitch de ${channel}`, 'system');
        })
        .catch(err => {
          console.error(err);
          addMessage('Erreur', 'Impossible de se connecter à Twitch.', 'system');
        });

      twitchClient.on('message', (chan, tags, message, self) => {
        const username = tags['display-name'] || tags.username;
        addMessage(username, message, 'twitch');
      });
    }

    // --- LOGIQUE YOUTUBE ---
    async function connectYouTube() {
      const apiKey = document.getElementById('yt-api-key').value.trim();
      const videoId = document.getElementById('yt-video-id').value.trim();

      if (!apiKey || !videoId) return alert('Entre la clé API et l\'ID de la vidéo YouTube');

      if (ytInterval) clearInterval(ytInterval);

      try {
        // Step 1: Récupérer le liveChatId depuis l'ID de la vidéo
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${apiKey}`);
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          return alert('Vidéo YouTube introuvable.');
        }

        const liveChatId = data.items[0].liveStreamingDetails?.activeLiveChatId;
        if (!liveChatId) {
          return alert('Cette vidéo n\'est pas un live en cours ou le chat est désactivé.');
        }

        addMessage('Système', 'Connecté au chat YouTube !', 'system');

        // Step 2: Boucle pour récupérer les messages en direct
        fetchYouTubeMessages(liveChatId, apiKey);
        ytInterval = setInterval(() => {
          fetchYouTubeMessages(liveChatId, apiKey);
        }, 5000); // Vérifie toutes les 5 secondes

      } catch (err) {
        console.error(err);
        addMessage('Erreur', 'Erreur de connexion à YouTube.', 'system');
      }
    }

    async function fetchYouTubeMessages(liveChatId, apiKey) {
      let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?part=snippet,authorDetails&liveChatId=${liveChatId}&key=${apiKey}`;
      if (nextPageToken) {
        url += `&pageToken=${nextPageToken}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.nextPageToken) {
          nextPageToken = data.nextPageToken;
        }

        if (data.items) {
          data.items.forEach(item => {
            const author = item.authorDetails.displayName;
            const message = item.snippet.displayMessage;
            addMessage(author, message, 'yt');
          });
        }
      } catch (err) {
        console.error('Erreur récupération messages YouTube', err);
      }
    }

    // --- AFFICHAGE ---
    function addMessage(author, text, platform) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';

      let tag = '[Twitch]';
      let tagClass = 'platform-twitch';

      if (platform === 'yt') {
        tag = '[YouTube]';
        tagClass = 'platform-yt';
      } else if (platform === 'system') {
        tag = '[Info]';
        tagClass = 'system';
      }

      msgDiv.innerHTML = `<span class="${tagClass}">${tag}</span> <strong>${escapeHtml(author)} :</strong> ${escapeHtml(text)}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
  </html>
